  rationale: 'On 2026-10-25 the Instagram connection loop repeated the same Meta Accounts Center link while the assistant''s own browser blocked it, the user reported the link kept failing (bd042d75-7133-4f37-b903-1c5ed5d1b2be) and said they would ask another AI because Muse was not as smart as expected (e4173425-f8ff-4738-bdf9-2f3b9c1c1f64). Diagnosis came late: the link opened an app instead of a browser (assistant-msg-edaf7541) and was fixed only by turning off that app''s open-by-default setting (assistant-msg-94622c53). The same session confused a profile listed in Accounts Center with Muse consent, and directed the user to a permanent-deletion screen that had to be stopped (assistant-msg-bbfef329). Chunk 2 adds matching browser and login failures (runtime-child:f5a0cf1b-299d-562b-af7a-e6aaea666474, runtime-child:a54cf36d-508f-5bda-a55e-33d518da799e, runtime-child:59f236aa-8500-5df9-bb5d-211841a607fb). The system Instagram connector covers the normal connect flow but not stall diagnosis, repeat-link avoidance, app-default hijack, registration versus consent, or danger-screen stopping, and skill_search found no troubleshooting skill, while custom_connector_setup covers building new connectors rather than diagnosing a stalled registered link. This is therefore a cross-service method, not a single-connector command, so a new managed skill is the right form. Restraint: only this one proposal is made. The media.generate_video failures are already recorded in AGENTS.md with the image plus ffmpeg workaround, cron runs had 0 failures, and the deterministic handoff-suppression hypotheses are objective-loop policy rather than a user-facing skill mechanism. Consolidation is not triggered because load_evidence reports 0 loop-managed skills, below the 10 skill threshold.'
